name: Clear PDF Files from Workflows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Delete PDFs from .github/workflows
        run: |
          find .github/workflows -maxdepth 1 -type f -iname "*.pdf" -delete

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/

          if git diff --cached --quiet; then
            echo "No PDF files to delete."
          else
            git commit -m "Remove accidental PDF files"
            git push
          fi
